name: digger

services:
  suricata:
    image: ghcr.io/pwnzer0tt1/digger-suricata:latest
    build: ./suricata
    volumes:
      - "./input_pcaps:/input_pcaps:rw"
      - "./suricata/rules:/suricata/rules:ro"
      - "./suricata/output:/suricata/output:rw"
      - "./config:/config:rw"

    # Mode A: pcap replay mode (slower, for archives replay or rootless CTF)
    # Add `--pcap-file-continuous` to watch for new pcap in folder.
    command: -r /input_pcaps --pcap-file-continuous
    depends_on:
      - postgres

  webapp:
    image: ghcr.io/pwnzer0tt1/digger-webapp:latest
    build: ./webapp
    restart: always
    volumes:
      - "./input_pcaps:/input_pcaps:ro" # remove to prevent users from downloading pcaps
      - "./suricata/output:/suricata/output:ro"
      - "./config:/config:rw"
    ports:
      - 0.0.0.0:8000:8000
    depends_on:
      - postgres

  postgres:
    image: postgres:18-alpine3.23
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      
  grafana:
    image: ghcr.io/pwnzer0tt1/digger-grafana:latest
    build: ./grafana
    restart: always
    ports:
      - "8001:3000"
    depends_on:
      - postgres

volumes:
  pgdata: