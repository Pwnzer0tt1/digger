[package]
name = "suricata-stream-postgres-output"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "stream_postgres_output"

[build-dependencies]
cc = "1.0"

[dependencies]
env_logger = { version = "0.11.8", default-features = false }
log = "0.4.27"
diesel = { version = "2.2.0", features = ["postgres"] }
diesel_migrations = "2.2.0"
dotenvy = "0.15"
chrono = "0.4.41"
