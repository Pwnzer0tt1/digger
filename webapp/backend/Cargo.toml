[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
actix-files = "0.6.10"
diesel = { version = "2.3.11", features = ["postgres", "r2d2"] }
diesel_migrations = "2.3.2"
chrono = "0.4.45"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
divan = "0.1.21"

[[bench]]
name = "queries"
harness = false